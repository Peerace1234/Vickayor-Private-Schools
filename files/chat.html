<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vickayor - Chat</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .chat-container {
        display: flex;
        height: 100vh;
        background: #f5f5f5;
      }

      .chat-sidebar {
        width: 300px;
        background: #fff;
        border-right: 1px solid #ddd;
        overflow-y: auto;
        padding: 15px;
      }

      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .chat-header {
        background: #2c3e50;
        color: #fff;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .message {
        padding: 10px 15px;
        border-radius: 8px;
        max-width: 60%;
        word-wrap: break-word;
      }

      .message.sent {
        background: #3498db;
        color: #fff;
        align-self: flex-end;
      }

      .message.received {
        background: #ecf0f1;
        color: #333;
        align-self: flex-start;
      }

      .chat-input {
        padding: 15px;
        background: #fff;
        border-top: 1px solid #ddd;
        display: flex;
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }

      .chat-input button {
        padding: 10px 20px;
        background: #3498db;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }

      .chat-input button:hover {
        background: #2980b9;
      }

      .room-item {
        padding: 10px;
        margin: 5px 0;
        background: #f9f9f9;
        border-radius: 4px;
        cursor: pointer;
        border-left: 3px solid #3498db;
      }

      .room-item:hover {
        background: #ecf0f1;
      }

      .room-item.active {
        background: #e8f4f8;
        border-left-color: #2c3e50;
      }

      .typing-indicator {
        font-style: italic;
        color: #999;
        font-size: 12px;
        padding: 5px 0;
      }

      .logout-btn {
        padding: 8px 16px;
        background: #e74c3c;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <!-- Sidebar with rooms -->
      <div class="chat-sidebar">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h2 style="margin: 0; font-size: 18px">Rooms</h2>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div id="roomsList"></div>
        <button
          style="
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
          "
          onclick="createRoom()"
        >
          New Room
        </button>
      </div>

      <!-- Main chat area -->
      <div class="chat-main">
        <div class="chat-header">
          <h1 style="margin: 0; font-size: 20px" id="currentRoomName">
            Select a room to start chatting
          </h1>
        </div>

        <div class="chat-messages" id="messagesList"></div>

        <div
          id="typingIndicator"
          class="typing-indicator"
          style="display: none; padding: 5px 20px"
        ></div>

        <div class="chat-input" id="chatInputArea" style="display: none">
          <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
          />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
      const apiUrl = localStorage.getItem("apiUrl") || "http://localhost:5000";
      let socket = null;
      let currentRoom = null;
      let token = localStorage.getItem("token");

      // Initialize Socket.io connection
      function initSocket() {
        socket = io(apiUrl, {
          auth: {
            token: token,
          },
        });

        socket.on("connect", () => {
          console.log("Connected to chat server");
          loadRooms();
        });

        socket.on("joined", ({ roomId }) => {
          console.log("Joined room:", roomId);
        });

        socket.on("new_message", (message) => {
          if (message.room_id === currentRoom) {
            displayMessage(message);
          }
        });

        socket.on("user_typing", ({ userId, name, isTyping }) => {
          const indicator = document.getElementById("typingIndicator");
          if (isTyping) {
            indicator.textContent = `${name} is typing...`;
            indicator.style.display = "block";
          } else {
            indicator.style.display = "none";
          }
        });

        socket.on("error", (data) => {
          alert("Error: " + data.message);
        });

        socket.on("disconnect", () => {
          console.log("Disconnected from chat server");
        });
      }

      async function loadRooms() {
        try {
          const response = await fetch(`${apiUrl}/api/chat/rooms`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const rooms = await response.json();

          const roomsList = document.getElementById("roomsList");
          roomsList.innerHTML = "";

          rooms.forEach((room) => {
            const div = document.createElement("div");
            div.className = "room-item";
            div.innerHTML = `<strong>${room.name}</strong><br><small>${room.last_message || "No messages yet"}</small>`;
            div.onclick = () => selectRoom(room.id, room.name);
            roomsList.appendChild(div);
          });
        } catch (error) {
          console.error("Failed to load rooms:", error);
        }
      }

      async function selectRoom(roomId, roomName) {
        currentRoom = roomId;
        document.getElementById("currentRoomName").textContent = roomName;
        document.getElementById("chatInputArea").style.display = "flex";
        document.getElementById("messagesList").innerHTML = "";

        socket.emit("join_room", { roomId });

        try {
          const response = await fetch(
            `${apiUrl}/api/chat/rooms/${roomId}/messages`,
            {
              headers: { Authorization: `Bearer ${token}` },
            },
          );
          const messages = await response.json();

          messages.forEach((msg) => displayMessage(msg));
        } catch (error) {
          console.error("Failed to load messages:", error);
        }
      }

      function displayMessage(message) {
        const messagesList = document.getElementById("messagesList");
        const div = document.createElement("div");
        div.className = `message ${message.sender_id === getUserId() ? "sent" : "received"}`;
        div.innerHTML = `<strong>${message.sender_name}</strong><br>${message.content || "(file)"}`;
        messagesList.appendChild(div);
        messagesList.scrollTop = messagesList.scrollHeight;
      }

      function sendMessage() {
        const input = document.getElementById("messageInput");
        const content = input.value.trim();

        if (!content || !currentRoom) return;

        socket.emit("send_message", {
          roomId: currentRoom,
          content: content,
        });

        input.value = "";
      }

      function createRoom() {
        const name = prompt("Enter room name:");
        if (!name) return;

        fetch(`${apiUrl}/api/chat/rooms`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ name, type: "group" }),
        })
          .then((res) => res.json())
          .then(() => loadRooms())
          .catch((err) => {
            alert("Failed to create room");
            console.error(err);
          });
      }

      function logout() {
        localStorage.removeItem("token");
        window.location.href = "/login";
      }

      function getUserId() {
        // Parse JWT or get from sessionStorage
        try {
          const parts = token.split(".");
          if (parts.length === 3) {
            const payload = JSON.parse(atob(parts[1]));
            return payload.id;
          }
        } catch (e) {
          console.error("Failed to parse token");
        }
        return null;
      }

      // Detect typing
      document.addEventListener("keyup", (e) => {
        if (e.key !== "Enter" && currentRoom) {
          socket.emit("typing", { roomId: currentRoom, isTyping: true });
        }
      });

      // Initialize on page load
      window.addEventListener("load", () => {
        if (!token) {
          window.location.href = "/login";
        } else {
          initSocket();
        }
      });

      // Send on Enter key
      document.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && e.target.id === "messageInput") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
